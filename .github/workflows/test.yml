name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No install step exists on purpose: the panel has no dependencies, so a
      # green run here is also the proof of that claim.
      - run: node --test test/*.test.mjs
